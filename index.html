<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Situation Room — Client Coverage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8f8f7;
      color: #1a1a1a;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .coverage {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 64px 24px 72px;
    }

    .coverage__heading {
      margin: 0 0 40px;
      text-align: center;
      font-size: clamp(1.25rem, 2vw, 1.5rem);
      font-weight: 500;
      line-height: 1.35;
      letter-spacing: -0.02em;
      color: #3d3d3d;
    }

    .coverage__grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .coverage-card {
      display: flex;
      flex-direction: column;
      min-height: 220px;
      padding: 28px 28px 24px;
      background: #f2f2f0;
      color: inherit;
      text-decoration: none;
      transition: background 0.15s ease;
    }

    .coverage-card:hover,
    .coverage-card:focus-visible {
      background: #ebebe8;
      outline: none;
    }

    .coverage-card__outlet {
      margin: 0 0 16px;
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #6b6b6b;
    }

    .coverage-card__title {
      margin: 0 0 28px;
      flex: 1;
      font-size: 0.9375rem;
      line-height: 1.55;
      letter-spacing: -0.01em;
      color: #1f1f1f;
    }

    .coverage-card__client {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: auto;
      padding-top: 4px;
    }

    .coverage-card__logo {
      flex-shrink: 0;
      width: auto;
      max-width: 120px;
      height: 32px;
      object-fit: contain;
      object-position: left center;
    }

    .coverage-card__client-name {
      margin: 0;
      font-size: 0.875rem;
      font-weight: 600;
      line-height: 1.3;
      color: #111;
    }

    @media (max-width: 960px) {
      .coverage__grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .coverage {
        padding: 48px 16px 56px;
      }

      .coverage__heading {
        margin-bottom: 28px;
      }

      .coverage__grid {
        grid-template-columns: 1fr;
      }

      .coverage-card {
        min-height: 0;
      }
    }
  </style>
</head>
<body>
  <section class="coverage" aria-labelledby="coverage-heading">
    <h2 class="coverage__heading" id="coverage-heading"></h2>
    <div class="coverage__grid" id="coverage-grid"></div>
  </section>

  <script>
    const CONFIG = {
      heading: "Client coverage across leading media outlets.",

      items: [
        {
          outlet: "The Wall Street Journal",
          title: "Ireland's Gift to Trump: Shamrocks and a $6.1 Billion Investment Pledge",
          client: "Enterprise Ireland",
          logo: "logos/enterprise-ireland.svg",
          url: "https://www.wsj.com/politics/policy/irelands-gift-to-trump-shamrocks-and-a-6-1-billion-investment-pledge-26592bda"
        },
        {
          outlet: "Los Angeles Times",
          title: "How to Prevent Black Kids From Becoming Stuck in Foster Care",
          client: "Kidsave",
          logo: "logos/kidsave.svg",
          url: "https://www.latimes.com/opinion/story/2024-03-12/black-foster-care-adoption"
        },
        {
          outlet: "The New York Times",
          title: "Ashley Judd: The Right to Keep Private Pain Private",
          client: "Ashley Judd",
          logo: "logos/ashley-judd.svg",
          url: "https://www.nytimes.com/2022/08/31/opinion/ashley-judd-naomi-suicide.html"
        },
        {
          outlet: "The Guardian",
          title: "New World Bank Business Ratings Will Examine Countries' Worker Rights",
          client: "World Bank",
          logo: "logos/world-bank.svg",
          url: "https://www.theguardian.com/business/2023/jun/07/new-world-bank-business-ratings"
        },
        {
          outlet: "TODAY",
          title: "How to Best Manage Your Career at Any Stage of Life",
          client: "SHRM",
          logo: "logos/shrm.svg",
          url: "https://www.youtube.com/watch?v=VD7P6ZbTdUs"
        },
        {
          outlet: "PBS NewsHour",
          title: "Mastercard Foundation Gives $1.3 Billion to Boost Vaccinations in Africa",
          client: "Mastercard Foundation",
          logo: "logos/mastercard-foundation.svg",
          url: "https://www.youtube.com/watch?v=4-W6y2GZZCs"
        }
      ]
    };

    function renderCoverage() {
      const heading = document.getElementById("coverage-heading");
      const grid = document.getElementById("coverage-grid");

      heading.textContent = CONFIG.heading;

      grid.replaceChildren(
        ...CONFIG.items.map((item) => {
          const card = document.createElement("a");
          card.className = "coverage-card";
          card.href = item.url;
          card.target = "_blank";
          card.rel = "noopener noreferrer";
          card.setAttribute("aria-label", `${item.outlet}: ${item.title}`);

          const outlet = document.createElement("p");
          outlet.className = "coverage-card__outlet";
          outlet.textContent = item.outlet;

          const title = document.createElement("p");
          title.className = "coverage-card__title";
          title.textContent = item.title;

          const client = document.createElement("div");
          client.className = "coverage-card__client";

          const logo = document.createElement("img");
          logo.className = "coverage-card__logo";
          logo.src = item.logo;
          logo.alt = `${item.client} logo`;
          logo.loading = "lazy";
          logo.decoding = "async";

          const clientName = document.createElement("p");
          clientName.className = "coverage-card__client-name";
          clientName.textContent = item.client;

          client.append(logo, clientName);
          card.append(outlet, title, client);

          return card;
        })
      );
    }

    function notifyParentHeight() {
      const height = document.documentElement.scrollHeight;
      window.parent.postMessage({ type: "gsr-coverage-resize", height }, "*");
    }

    renderCoverage();
    notifyParentHeight();
    window.addEventListener("load", notifyParentHeight);
    window.addEventListener("resize", notifyParentHeight);

    if ("ResizeObserver" in window) {
      new ResizeObserver(notifyParentHeight).observe(document.body);
    }
  </script>
</body>
</html>
